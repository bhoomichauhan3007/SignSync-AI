services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: signsync
      POSTGRES_PASSWORD: signsync
      POSTGRES_DB: signsync
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signsync"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://signsync:signsync@db:5432/signsync
      SECRET_KEY: change-this-in-real-deployments
      AI_MODE: mock
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
